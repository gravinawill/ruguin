apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-server
  namespace: core-server
  labels:
    app: core-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: core-server
  template:
    metadata:
      labels:
        app: core-server
    spec:
      # core-server never calls the Kubernetes API, so the default token has nothing to do here.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: core-server
          # sha-<commit> tag from release-image.yml's tagging scheme (see .github/workflows/
          # release-image.yml) — bump this line and let ArgoCD sync it for every new deploy;
          # there's no automation wiring a tag bump to this file yet (see the design doc's Risks).
          image: ghcr.io/gravinawill/ruguin/core-server:latest
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3333
              name: http
          envFrom:
            - configMapRef:
                name: core-server-config
            - secretRef:
                name: core-server-secrets
          # Fargate sizes the pod's microVM from the sum of requests, so a limit above the request is
          # unreachable — matching them keeps what's declared and what's provisioned the same number.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Deliberately not /health: that endpoint checks RDS and Valkey, so an outage in either
          # would restart every replica in a loop without fixing anything. Withdrawing from the
          # Service is the right response to a sick dependency, and that's readiness' job above.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
