name: ruguin

x-logging: &loki-logging
  driver: loki
  options:
    loki-url: 'http://localhost:3100/loki/api/v1/push'
    loki-external-labels: 'compose_service={{.Name}}'
    loki-retries: '5'
    loki-batch-size: '400'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - 'postgres'
      - '-c'
      - 'shared_preload_libraries=pg_stat_statements'
      - '-c'
      - 'pg_stat_statements.track=all'
    environment:
      POSTGRES_USER: ruguin
      POSTGRES_PASSWORD: ruguin
      POSTGRES_DB: ruguin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates extra databases used by the optional dev-tooling stack (docker-compose.tools.yml)
      # on first boot — see postgres-init/01-create-tooling-databases.sh. No-op if that file
      # stack is never used.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruguin']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *loki-logging

  redis:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *loki-logging

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for clients on the host machine (localhost); INTERNAL is for other
      # containers on this compose network (e.g. infrastructure/local/docker-compose.tools.yml's
      # Conduktor), which can't resolve "localhost" back to the kafka container.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *loki-logging

  localstack:
    image: localstack/localstack:stable
    restart: unless-stopped
    ports:
      - '4566:4566'
    environment:
      SERVICES: ses
      DEFAULT_REGION: us-east-1
      # Free since 2026-03-23 LocalStack requires an auth token even for community-tier
      # features (previously fully anonymous). Sign up (free) at https://app.localstack.cloud,
      # grab a token, and put it in infrastructure/local/.env — see .env.example. Fails fast
      # with a clear message here instead of crash-looping with a cryptic license error.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Free LocalStack token required — see infrastructure/local/.env.example}
    logging: *loki-logging

volumes:
  postgres_data:
  valkey_data:
