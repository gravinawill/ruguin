apiVersion: 1

groups:
  - orgId: 1
    name: infra-alerts
    folder: Infra
    interval: 1m
    rules:
      - uid: kafka-consumer-lag-high
        title: Kafka consumer lag alto
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(kminion_kafka_consumer_group_topic_lag) by (group_id)
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              # Grafana 13.1.1 (image tag `latest`) rejects the brief's `expr: ''` with
              # "no variable specified to reference for refId C" — the SSE expression
              # model's field is `expression` (confirmed against Grafana's own file-
              # provisioning docs example), not `expr`, and it must name the refId being
              # thresholded.
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1000]
                  operator:
                    type: and
                  query:
                    params: [A]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Consumer group {{ $labels.group_id }} está com lag acima de 1000 mensagens'

      - uid: postgres-connections-near-limit
        title: Postgres perto do limite de conexões
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # The brief's raw `A / B` divides an unlabeled sum() by a labeled series
              # (pg_settings_max_connections carries instance/job labels), which fails
              # Prometheus's default one-to-one vector matching and silently returns no
              # data (confirmed: rule sat in "Pending (NoData)" with this exact query).
              # scalar() collapses the single-series denominator so the division works.
              expr: sum(pg_stat_activity_count) / scalar(pg_settings_max_connections) * 100
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              # See note above (Kafka rule) — the SSE field is `expression`, not `expr`.
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Postgres usando mais de 80% das conexões disponíveis'
