name: ruguin

x-logging: &loki-logging
  driver: loki
  options:
    loki-url: 'http://localhost:3100/loki/api/v1/push'
    loki-external-labels: 'compose_service={{.Name}}'
    loki-retries: '5'
    loki-batch-size: '400'

services:
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    logging: *loki-logging

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - '3200:3200'
    logging: *loki-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - tempo
    logging: *loki-logging

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - otel-collector
    logging: *loki-logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://postgres_exporter:postgres_exporter@postgres:5432/ruguin?sslmode=disable'
    depends_on:
      postgres:
        condition: service_healthy
    logging: *loki-logging

  kminion:
    image: redpandadata/kminion:latest
    restart: unless-stopped
    # kminion has no -config.filepath CLI flag; it only loads YAML via the
    # CONFIG_FILEPATH env var (verified against redpandadata/kminion:latest).
    environment:
      CONFIG_FILEPATH: /etc/kminion/config.yaml
    volumes:
      - ./observability/kminion/kminion-config.yaml:/etc/kminion/config.yaml:ro
    depends_on:
      kafka:
        condition: service_healthy
    logging: *loki-logging

volumes:
  loki_data:
  tempo_data:
  prometheus_data:
