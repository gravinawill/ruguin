sonar.exclusions=**/generated/**,**/dist/**,**/coverage/**,**/*.config.ts,.claude/**
sonar.javascript.lcov.reportPaths=apps/core-server/coverage/lcov.info,packages/cache/coverage/lcov.info,packages/env/coverage/lcov.info,packages/shared-domain/coverage/lcov.info,packages/utils/coverage/lcov.info
sonar.testExecutionReportPaths=apps/core-server/coverage/sonar-report.xml,packages/cache/coverage/sonar-report.xml,packages/env/coverage/sonar-report.xml,packages/shared-domain/coverage/sonar-report.xml,packages/utils/coverage/sonar-report.xml

# Dockerfile.dev is local-dev-only tooling (never built or published by release-image.yml) with two
# rules that don't fit its actual configuration:
# - docker:S6470 flags the literal "COPY . ." pattern regardless of .dockerignore content. The real
#   risk it warns about (sweeping up secrets) is already closed by .dockerignore's .env/.env.*
#   exclusions (recursive as of this same change) — rewriting to dozens of explicit COPY paths would
#   trade this static-analysis pass for a Dockerfile that silently stops copying new root files.
# - docker:S6505 flags the missing --ignore-scripts on `pnpm install`. Adding it would break the
#   documented reason it's absent: dev needs Prisma's schema-engine and the other native builds
#   (@swc/core, esbuild) that pnpm-workspace.yaml's onlyBuiltDependencies already allow-lists —
#   pnpm's own blockExoticSubdeps mechanism already blocks scripts for everything not on that list,
#   a narrower and more precise control than the blanket flag this rule wants.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/core-server/Dockerfile.dev
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6505
sonar.issue.ignore.multicriteria.e2.resourceKey=apps/core-server/Dockerfile.dev
