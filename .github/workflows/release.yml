name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  # A cancelled mid-flight run can leave a pushed tag without the release/changelog
  # commit that goes with it, so a queued run waits instead of pre-empting one in progress.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # @semantic-release/github only creates releases and comments on issues/PRs referenced
      # by a commit — issues: write covers both, since GitHub's comment API treats a PR as an
      # issue. No plugin here creates or edits pull requests, so pull-requests: write is unused.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        # --ignore-scripts: this job never builds the apps (only runs semantic-release), so no
        # native binary (Prisma/SWC/esbuild) is needed here at all.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Record tags before release
        run: git tag --list > /tmp/tags-before.txt

      - name: Release
        run: pnpm exec multi-semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggregate changelog
        run: |
          node scripts/aggregate-changelog.mjs /tmp/tags-before.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet -- CHANGELOG.md && exit 0
          git commit -m "chore(changelog): aggregate this run's package releases"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3..."
            if git push; then
              exit 0
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          exit 1
