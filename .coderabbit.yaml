# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

tone_instructions: >-
  Be direct and specific. Cite the rule or file that justifies each point. Skip praise and
  restating the diff. If a finding is a matter of taste, say so.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  abort_on_close: true
  estimate_code_review_effort: true
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - '.*'

  slop_detection:
    enabled: true

  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional Commits, matching commitlint.config.mjs: type(scope): subject, with the
        subject in the imperative mood and no trailing period. The PR title becomes the commit
        message on squash merge.
    description:
      mode: warning

  path_filters:
    - '!**/src/generated/**'
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/coverage/**'
    - '!pnpm-lock.yaml'
    - '!infrastructure/terraform/**/.terraform.lock.hcl'
    - '!**/*.min.js'
    - '!**/*.claude'
    - '!**/*.agents'
    - '!**/*.codebuddy'
    - '!**/*.continue'
    - '!**/*.gitnexus'
    - '!**/*.junie'
    - '!**/*.kiro'
    - '!**/*.remember'
    - '!**/*.superpowers'
    - '!**/*.swarm'
    - '!**/docs/superpowers/**'

  path_instructions:
    - path: '**/domain/**'
      instructions: >-
        Flag any import of a framework or ORM here: @nestjs/*, Prisma, Fastify, or an HTTP concept.
        A transaction crosses a contract as the opaque TransactionContext, never as
        Prisma.TransactionClient. A Model is a domain class whose invariants are checked in a
        static create() returning Either — never a Prisma row type.

    - path: '**/application/**'
      instructions: >-
        Flag any import from infra/. A service forwards to one use case and returns: no branching,
        no repository access, and that emptiness is deliberate. A use case never calls another use
        case — an operation needing two belongs in an orchestrating use case that owns the
        transaction boundary. Controllers and listeners convert DTO or event payload into value
        objects and models, so a DTO must never reach a use case.

    - path: '**/infra/**'
      instructions: >-
        Adapters implement contracts declared in domain/. Nothing from the Prisma.* namespace may
        cross into application/ or domain/: a unique-constraint violation surfaces as a domain
        error carrying StatusError.CONFLICT, not as a generic internal error.

    - path: '**/*.ts'
      instructions: >-
        Any function returning Either needs an explicit return type annotation: success(x) alone
        infers Either<unknown, X>, and the mismatch then surfaces far from its cause. Expected
        failures return Either; throw is for bugs only.

    - path: '**/__tests__/**'
      instructions: >-
        Test names are written in English. The suffix carries meaning: .unit.ts performs no I/O,
        .int.ts may use real Postgres or Valkey, .e2e.ts drives HTTP through the built app. A use
        case should never need an .int.ts, since it depends only on contracts. Prefer asserting on
        behaviour over asserting on call counts.

    - path: '**/prisma/migrations/**'
      instructions: >-
        Review these as irreversible. Flag any DROP COLUMN, DROP TABLE or type change that loses
        data, and say what the recovery path would be. A column added NOT NULL without a default
        fails on a non-empty table; CREATE INDEX without CONCURRENTLY locks writes for the whole
        build. Renames arrive as drop-plus-add, which is data loss unless the migration was edited
        by hand. An already-applied migration that gets edited is a checksum failure elsewhere,
        not a fix.

    - path: '**/*.prisma'
      instructions: >-
        One .prisma file per module under prisma/schema/, so a diff says which module changed.
        Every model needs an explicit @@map, and any column a query filters or sorts on needs a
        matching @@index.

    - path: '.github/workflows/**'
      instructions: >-
        Actions must be pinned and permissions scoped to the minimum the job needs. Flag any
        secret interpolated into a run block where an env var would do, and any use of
        pull_request_target that checks out untrusted code.

    - path: 'infrastructure/terraform/**'
      instructions: >-
        Module sources here are registry-sourced (terraform-aws-modules/*, version constraints),
        not git-sourced — Checkov's CKV_TF_1 (commit-SHA pinning) only applies to git:: sources
        per its own documented scope, so don't flag registry version constraints under that rule.
        OTEL_EXPORTER_OTLP_ENDPOINT intentionally includes the full /v1/traces path:
        core-server's create-tracing-sdk.ts passes it straight through as OTLPTraceExporter's
        `url`, which is used as-is (no auto-suffixing) — only unset `url` triggers the SDK's own
        auto-append behavior. Kubernetes resources belong in the core-server namespace, not
        default. Secrets no longer live in Terraform state (see
        docs/superpowers/specs/2026-08-04-external-secrets-operator-design.md): database_password
        is RDS-managed natively via manage_master_user_password, and docs_password/
        honeycomb_api_key/ghcr_token sync from AWS Secrets Manager through an ExternalSecret. One
        known, documented gap remains: RDS rotates its managed password every 7 days, but
        core-server's pods read it via envFrom (no hot-reload), so already-running pods need a
        manual restart after each rotation until a longer-term fix is chosen — not an oversight to
        re-flag every PR.

    - path: 'infrastructure/k8s/**'
      instructions: >-
        Resources belong in the core-server namespace, not default. TLS termination on the
        public NLB and immutable release tags on the Deployment's image are known, documented
        gaps (need an ACM cert/domain and a release-promotion pipeline that don't exist yet) —
        flag once per gap is enough, this doesn't need repeating on every PR that touches these
        files.

  tools:
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    languagetool:
      enabled: false
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    osvScanner:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    prismaLint:
      enabled: true
    squawk:
      enabled: true
    dotenvLint:
      enabled: true
    shellcheck:
      enabled: true
    checkov:
      enabled: true
    hadolint:
      enabled: true

knowledge_base:
  learnings:
    scope: local
  pull_requests:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/CLAUDE.md'
      - 'docs/superpowers/specs/*.md'

chat:
  auto_reply: true
